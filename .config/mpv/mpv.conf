# @sentakuhm
### Profile ###

include="~~/profiles.conf"

### Video ###
vo=gpu-next
gpu-api=vulkan
hwdec=vulkan
hwdec-codecs=all
profile=high-quality
dither-depth=auto

video-sync=display-resample
interpolation=yes
tscale=oversample
vd-lavc-threads=0             # Auto (uses all cores efficiently)

#vulkan-async-compute=yes
#d3d11-exclusive-fs=no

deband=no
#deband-iterations=1
#deband-threshold=48
#deband-range=16
#deband-grain=32

temporal-dither=yes

# Cache (excellent for anime/network files)
cache=yes
cache-secs=180
demuxer-max-bytes=1G
demuxer-max-back-bytes=1G

### Audio and Subtitles ###

slang=ar,ara,Arabic,en,eng,English
alang=ja,jp,jpn,jap,Japanese,kr,kor,ger,en,eng,English

sub-blur=0.5
sub-scale=1.0
#sub-use-margins=yes
sub-margin-y=30
sub-font=Akhbar
sub-color=#FFFFFF
sub-outline-color=#000000
sub-outline-size=2
sub-auto=all

volume-max=150
sub-fix-timing=yes
audio-channels=auto
blend-subtitles=yes
sub-ass-override=yes
audio-file-auto=fuzzy
audio-pitch-correction=yes
audio-normalize-downmix=yes
sub-file-paths-append=subtitles
demuxer-mkv-subtitle-preroll=yes
sub-file-paths=sub;subs;subtitles
af-add='dynaudnorm=g=5:f=250:r=0.9:p=0.5'

### General ###

fs=yes
snap-window
keep-open=always
geometry=50%:50%
save-position-on-quit=yes
watch-later-options-remove=pause

### OSD/OSC ###

osc=no
border=no
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font='JetBrains Mono'
